<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #badge {
        display: none;
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px;
        border-radius: 999px;
        background: rgba(20, 16, 10, 0.78);
        border: 1px solid rgba(214, 170, 74, 0.85);
        color: #f3dfa8;
        font: 600 12px/1.4 Georgia, 'Times New Roman', serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
    }
    #badge::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        border-radius: 50%;
        background: #d6aa4a;
        animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.25; } }
</style>
</head>
<body>
<div id="badge"></div>
<script>
    const badge = document.getElementById('badge');
    window.addEventListener('message', (event) => {
        const data = event.data;
        if (data.action === 'badge') {
            badge.textContent = data.text || '';
            badge.style.display = data.show ? 'block' : 'none';
        }
    });
</script>
</body>
</html>
